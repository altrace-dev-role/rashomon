# rashomon GoReleaser configuration
#
# Usage:
#   goreleaser check                           # validate this file
#   goreleaser build --snapshot --clean        # local build, all targets
#   goreleaser release --snapshot --clean      # full pipeline without publishing
#
# One pure-Go binary, no cgo, so all six targets cross-compile natively.

version: 2

project_name: rashomon

builds:
  - id: rashomon
    main: ./cmd/rashomon
    binary: rashomon
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      # Keep the build directory out of the binary: paths recorded by the
      # compiler are the one place a "no content, ever" tool could leak the
      # machine it was built on.
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: rashomon
    ids:
      - rashomon
    name_template: "rashomon_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE*
      # The binaries are statically linked and pure Go, so every third-party
      # module is compiled INTO them. Their licences have to travel with the
      # artifact, not just live in the repository.
      - THIRD_PARTY_NOTICES

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

# NO HOMEBREW BLOCK, deliberately, and this is the record of why.
#
# It published to altrace-dev-role/altrace-homebrew-tap, which is PRIVATE and
# also carries a different, closed product's formulae. So the public README's
# `brew tap ...` instruction failed for everyone who was not the author, and it
# has been removed; and the release job held HOMEBREW_TAP_TOKEN, a credential
# with contents:write on that closed product's distribution path, reachable
# from any code execution in this workflow.
#
# Three smaller things went with it. `brews` is hard-deprecated since goreleaser
# v2.16, and `goreleaser check` exits 2 on any deprecation -- so the command
# this file's own header advertises failed against this file. It also had no
# `skip_upload: auto`, so tagging a release candidate, which the release
# workflow's header names as expected, would have rewritten the stable formula
# and moved every existing user onto an RC on their next `brew upgrade`. And
# `brews` is removed entirely in goreleaser v3, so keeping it pinned this repo
# to v2 forever.
#
# Homebrew comes back with a PUBLIC tap of its own -- altrace-dev-role/
# homebrew-rashomon, which also earns the `brew install owner/tap/formula`
# shorthand -- as `homebrew_casks` if the macOS binary is ever signed and
# notarized, or as a formula in a tap that serves Linux too. Until then
# `go install` is the documented route and it works today.

changelog:
  use: git
  filters:
    exclude:
      - "^Merge "
