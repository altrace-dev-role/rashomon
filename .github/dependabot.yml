# rashomon dependency updates
#
# The module declares no requirements: standard library only, on the grounds
# that a PreToolUse hook which blocks tool calls when it panics has no room
# for a supply chain. It carried one dependency for a while, a pure-Go SQLite
# driver that read a proxy's store, and the proxy went with its era. The
# `gomod` entry stays, so that the next dependency is watched from its first
# day rather than from the day somebody remembers this file.
#
# The recorder's guarantee is not the absence of dependencies: a test asserts
# that no package in the binary imports a networking package, and another
# that nothing imports os/exec. What a dependency DOES add is a supply chain,
# which is what the entry watches.
version: 2

updates:
  # Go modules. Pinned by go.sum, which is the thing that makes a bump
  # reviewable: dependabot raises the version and the checksum together, so a
  # substituted artifact fails verification rather than landing quietly.
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"

  # GitHub Actions. Every `uses:` in .github/workflows is pinned to a full
  # commit SHA, which is exactly the arrangement that goes stale silently:
  # nothing in CI notices that a pin is two years behind. Dependabot bumps the
  # SHA and rewrites the version comment with it.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci(deps)"
