# rashomon Release -- cross-platform binaries, archives and checksums, all
# from .goreleaser.yml.
#
# Triggered on version tag push (e.g. v0.1.0, v1.0.0-rc.1).
name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}  # Deny all at workflow level, grant per job.

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    # A release that hangs holds a write-scoped token open for six hours.
    timeout-minutes: 30
    permissions:
      contents: write  # Create the GitHub release and upload its artifacts.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # GoReleaser builds the changelog from git history and reads the
          # previous tag to bound it; a shallow clone has neither.
          fetch-depth: 0
          # Do not leave a usable token in .git/config for the rest of the job.
          # The default is true, which means every later step -- including one
          # that compiles and runs third-party module code -- runs beside a
          # credential it has no reason to hold. Nothing here pushes.
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          # BUILD TOOLCHAIN, pinned here and NOT read from go.mod, for the
          # same reason and at the same version as the test job in ci.yaml:
          # see the note there. TestDEL21_GoVersionPinsAgree holds every
          # pin, in both files, to that one version.
          go-version: "1.27.4"
          cache: true
          # go.sum: the module has requirements now. See the note in ci.yaml.
          cache-dependency-path: go.sum

      # A TAG DOES NOT RUN CI. ci.yaml triggers on push-to-main and on pull
      # requests, neither of which fires for `git push --tags`, so without
      # these steps the first thing a release proves is that it compiles.
      # A published tag cannot be cleanly re-cut, so the gates run here too.
      - name: Test
        run: go test ./... -count=1 -race

      - name: Vet
        run: go vet ./...

      # go.mod names no module, so this checks the standard library and the
      # toolchain itself rather than a dependency graph. Publishing a binary
      # built with a known-vulnerable stdlib version is the failure this
      # catches, and a release is the last moment it is cheap to catch.
      # ci.yaml runs the same line (-scan module, and why, is explained
      # there), and TestDEL21c holds the two to one version. Under go1.27.2,
      # v1.1.4 panics when it analyses linux/amd64 and passes on darwin.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -scan module -C cmd/rashomon

      # The plugin cannot compile Go when a user installs it, so the archive
      # .claude-plugin/marketplace.json installs has to carry prebuilt
      # recorders. It is built before GoReleaser and outside dist/, which
      # `release --clean` empties, and build-plugin.sh refuses a tag whose
      # version plugin/.claude-plugin/plugin.json does not name.
      - name: Build the plugin archive
        run: scripts/build-plugin.sh "${GITHUB_REF_NAME#v}" "$RUNNER_TEMP/rashomon-plugin.zip"

      # Kept as an artifact of this run, so a failed upload below loses
      # nothing: the release stays a draft and the archive can be attached
      # to it by hand.
      - name: Keep the plugin archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: rashomon-plugin-zip
          path: ${{ runner.temp }}/rashomon-plugin.zip
          if-no-files-found: error

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de  # v7.3.0
        with:
          # EXACT, not a constraint. "~> v2" pinned the wrapper action by SHA
          # while leaving the tool that actually compiles and publishes free to
          # be whatever v2.x was newest on release day -- so two tags cut a week
          # apart could be built by different toolchains with no diff in this
          # repository to point at. That is the failure the SHA pin above it
          # exists to prevent, left open in the same file.
          version: "v2.18.2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No HOMEBREW_TAP_TOKEN. The tap it wrote to is private and carries a
          # different, closed product's formulae, so this job held a credential
          # with contents:write on that product's distribution path. See the
          # note in .goreleaser.yml for what replaces it.

      # GoReleaser leaves the release a draft (.goreleaser.yml), and
      # releases/latest never names a draft, so the marketplace, which installs
      # releases/latest/download/rashomon-plugin.zip, cannot reach a release
      # without its archive. The asset name is the contract and must not
      # change. Publishing comes after the upload, never before it.
      - name: Attach the plugin archive and publish
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP/rashomon-plugin.zip" --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Read back what the marketplace reads: the archive releases/latest
      # serves has the size of the one built above.
      - name: Read the published archive back
        shell: bash
        run: |
          set -euo pipefail
          want=$(wc -c < "$RUNNER_TEMP/rashomon-plugin.zip" | tr -d ' ')
          got=none
          for try in 1 2 3 4 5 6; do
            got=$(curl -sSfL -o /dev/null -w '%{size_download}' "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/rashomon-plugin.zip") || got=none
            [ "$got" = "$want" ] && break
            sleep 10
          done
          echo "built $want bytes; releases/latest serves $got"
          test "$got" = "$want"
