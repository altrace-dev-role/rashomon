# rashomon CI
#
# Paths here are relative to the repository root because this module is the
# repository root: rashomon ships as its own repository, and go.mod sits
# beside this file's .github directory.
#
# Stages: gofmt -> vet (both build tags) -> race tests -> H-17 skip gate ->
# mutation sweep, with a cross-build matrix alongside.
name: CI

on:
  push:
    branches: [main]
  # No `branches:` filter, deliberately. With one, a pull request whose base is
  # another feature branch schedules none of these jobs and merges on a green
  # rollup that proves only that it links.
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      # The race detector requires cgo. Nothing in this module needs cgo to
      # build -- the released binaries are CGO_ENABLED=0 -- so it is enabled on
      # this job only, and the cross-build job sets it back to 0.
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955  # v4.3.0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          # Read from go.mod rather than pinned here, so the version CI builds
          # with cannot drift from the one the module declares. go.mod carries
          # no `toolchain` directive on purpose, so this resolves to the latest
          # patch of the declared minor.
          go-version-file: go.mod
          cache: true
          # go.sum, not go.mod. This module declared no requirements when these
          # workflows were written and now depends on modernc.org/sqlite plus
          # its indirect set, so keying the cache on go.mod would miss every
          # dependency change and serve a stale module cache. What is cached is
          # both the module cache and the build cache, and the mutation sweep's
          # compile-and-test cycles use the second heavily.
          cache-dependency-path: go.sum

      # The mutation sweep and the acceptance suite shell out to python3, git,
      # unshare and strace. ubuntu-latest ships the first three (unshare comes
      # with util-linux); strace is not in the image.
      #
      # This job is the guaranteed home of H-17's two dynamic tests, which are
      # Linux-only and skip -- with a message saying why -- anywhere their
      # tooling is missing or not permitted. A macOS laptop runs only the
      # static-import half and still exits green:
      #
      #   TestH17_CaptureIsIdenticalWithNetworkDenied  needs `unshare -n`
      #   TestH17_HandlerOpensNoSockets                needs strace to attach
      #
      # `unshare -n` creates a network namespace WITHOUT a user namespace,
      # which takes CAP_SYS_ADMIN, and the runner user is unprivileged -- so
      # without the setcap below the test's probe (`unshare -n true`) gets
      # EPERM and the test skips. The file capability grants that one binary
      # that one capability on a throwaway VM, and keeps `go test` itself
      # unprivileged; running the suite under sudo would instead run every
      # test as root and quietly change what they exercise (ownership, modes,
      # HOME).
      #
      # A skipped test is invisible in the default `go test` output, which is
      # how this coverage went missing once already. The "H-17 dynamic tests"
      # step below re-runs them verbosely and turns any SKIP into a red build.
      - name: Install strace, and let unshare create network namespaces
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends strace
          sudo setcap cap_sys_admin+ep "$(command -v unshare)"

      # Prints nothing on failure by design -- run `gofmt -l .` locally to see
      # which files are unformatted.
      - name: gofmt
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      # The acceptance suite compiles the binary with -tags rashomonfault, so the
      # fault-injection points are code no release contains and nothing else
      # compiles. Vet them under the tag rather than letting them rot.
      - name: Vet (rashomonfault build tag)
        run: go vet -tags rashomonfault ./...

      - name: Test with race detector
        run: go test ./... -count=1 -race

      # H-17's runtime evidence must actually run here, not merely not-fail.
      # The race step above already executed these tests; this step exists to
      # make their SKIP path fatal. `go test` exits 0 for a skipped test, so a
      # runner-image change that dropped strace or the unshare grant would
      # otherwise shed the coverage without a trace.
      #
      # Two checks, because they fail differently:
      #   - any `--- SKIP` in the H-17 run fails, with the test's own skip
      #     message in the log right above it;
      #   - each dynamic test must positively `--- PASS`, so renaming or
      #     deleting one cannot slip past a grep that only hunts skips.
      #
      # What this job still does NOT cover: TestRead_AgainstARealProxyStore
      # (internal/wire/real_store_check_test.go) stays opt-in behind
      # RASHOMON_REAL_STORE=/path/to/causal.db and has never run, here or
      # anywhere. It is the one test that would catch the Altrace proxy
      # drifting causal.db's schema out from under internal/wire's reader,
      # and it needs a store the real proxy wrote, which the proxy team has
      # yet to provide. When such a fixture lands, wire it into this job.
      - name: H-17 dynamic tests (a SKIP is a failure)
        shell: bash
        run: |
          go test -v -count=1 -run '^TestH17_' ./test/acceptance | tee "$RUNNER_TEMP/h17.out"
          failed=0
          for t in TestH17_CaptureIsIdenticalWithNetworkDenied TestH17_HandlerOpensNoSockets; do
            if ! grep -q -- "--- PASS: ${t} " "$RUNNER_TEMP/h17.out"; then
              echo "::error::${t} did not PASS on this runner, so H-17's runtime evidence is gone"
              failed=1
            fi
          done
          if grep -- '--- SKIP' "$RUNNER_TEMP/h17.out"; then
            echo "::error::an H-17 test skipped; its reason is in the lines above"
            failed=1
          fi
          exit "${failed}"

      # The other half of the acceptance contract: break the implementation one
      # item at a time and confirm each item's tests go red. Exits non-zero if
      # any break goes undetected.
      - name: Mutation sweep
        run: python3 test/mutation/sweep.py

  cross-build:
    name: Cross build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    env:
      # Matches the release build: pure Go, so cross-compiling all six targets
      # needs no C toolchain.
      CGO_ENABLED: "0"
    strategy:
      # One broken target must not hide the state of the other five.
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955  # v4.3.0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum  # See the test job.

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build ./cmd/rashomon

      # `go build ./cmd/rashomon` reaches only what main imports, and the test
      # job vets for linux. The store has a lock_unix.go / lock_other.go split,
      # so the non-Unix half is otherwise never vetted. Vet's result depends on
      # GOOS and not on GOARCH, so this runs once rather than in both windows
      # cells.
      - name: Vet for windows
        if: matrix.goos == 'windows' && matrix.goarch == 'amd64'
        env:
          GOOS: windows
        run: go vet ./...
